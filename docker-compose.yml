services:
  postgres:
    image: postgres:16-alpine
    container_name: kybers-postgres
    environment:
      POSTGRES_USER: kybers
      POSTGRES_PASSWORD: kybers
      POSTGRES_DB: kybers
    ports:
      # Port hôte décalé pour éviter tout conflit avec un PostgreSQL local.
      # Le control-plane joint la base via le réseau interne, sur 5432.
      - "55432:5432"
    volumes:
      - kybers-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kybers -d kybers"]
      interval: 3s
      timeout: 3s
      retries: 15

  control-plane:
    build:
      # Contexte = racine du monorepo : le module control-plane référence
      # ../proto via une directive replace.
      context: .
      dockerfile: control-plane/Dockerfile
    container_name: kybers-control-plane
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kybers:kybers@postgres:5432/kybers?sslmode=disable
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      # Vide = authentification API désactivée. À renseigner hors dev local.
      API_TOKEN: ""
      # Domaine des URL générées. Son DNS doit pointer en wildcard
      # (*.domaine) vers l'ingress du cluster. Vide = repli sur nip.io.
      BASE_DOMAIN: "${BASE_DOMAIN:-}"
      # IP publique de l'ingress-controller, utilisée par le repli nip.io.
      INGRESS_IP: "${INGRESS_IP:-}"
      # Intégration Git : lecture seule de la documentation et des pipelines
      # des dépôts rattachés. Vide = onglets masqués.
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      # Vide = github.com. À renseigner pour GitHub Enterprise.
      GITHUB_API_URL: "${GITHUB_API_URL:-}"
      # Adresse gRPC annoncée aux agents dans le script d'installation.
      # Elle doit être joignable DEPUIS LES CLUSTERS, pas depuis le dashboard.
      AGENT_ADDR: "${AGENT_ADDR:-localhost:9090}"
      # Inscription libre : réservée au développement. En production, seul le
      # premier compte est créable sans invitation.
      OPEN_REGISTRATION: "${OPEN_REGISTRATION:-false}"
    ports:
      - "8080:8080"   # API REST (dashboard, CLI)
      - "9090:9090"   # gRPC (agents Data Plane)
    restart: unless-stopped

volumes:
  kybers-pgdata:
